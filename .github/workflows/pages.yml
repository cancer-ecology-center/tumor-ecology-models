name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check for dev branch
        id: devcheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dev branch not found; skipping /preview/"
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/checkout@v4
        if: steps.devcheck.outputs.exists == 'true'
        with:
          ref: dev
          path: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            dev/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Build main (prod)
        working-directory: main
        env:
          BASE_PATH: /tumor-ecology-models/
        run: npm ci && npm run build

      - name: Build dev (preview)
        if: steps.devcheck.outputs.exists == 'true'
        working-directory: dev
        env:
          BASE_PATH: /tumor-ecology-models/preview/
        run: npm ci && npm run build

      - name: Combine into site/
        run: |
          mkdir site
          cp -r main/dist/public/. site/
          if [ "${{ steps.devcheck.outputs.exists }}" = "true" ]; then
            mkdir site/preview
            cp -r dev/dist/public/. site/preview/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
