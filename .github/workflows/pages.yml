name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build main (prod)
        working-directory: main
        env:
          BASE_PATH: /tumor-ecology-models/
        run: |
          npm ci
          npm run build

      - name: Prepare site (root only)
        run: |
          mkdir -p site
          cp -r main/dist/public/. site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4

  deploy-dev-with-preview:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            dev/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build main (prod)
        working-directory: main
        env:
          BASE_PATH: /tumor-ecology-models/
        run: |
          npm ci
          npm run build

      - name: Build dev (preview)
        working-directory: dev
        env:
          BASE_PATH: /tumor-ecology-models/preview/
        run: |
          echo "BASE_PATH=$BASE_PATH"
          npm ci
          npm run build

      - name: Prepare site (root + preview)
        run: |
          mkdir -p site/preview
          cp -r main/dist/public/. site/
          cp -r dev/dist/public/. site/preview/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4